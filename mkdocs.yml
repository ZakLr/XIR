site_name: XIR
site_description: The semantic IR for interactive products. Give an agent the exact semantic slice it needs.
# The site renders markdown that already lives in the repo, so docs cannot drift
# from the code. `branding/build_site.py` stages those files into `.site-src/`
# and mkdocs builds from there. Nothing is duplicated in version control.
docs_dir: .site-src
site_dir: site

site_url: https://zaklr.github.io/XIR/
repo_url: https://github.com/ZakLr/XIR
repo_name: ZakLr/XIR
edit_uri: edit/main/

theme:
  name: material
  custom_dir: docs/overrides
  logo: logo.svg
  favicon: favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  font:
    text: Inter
    code: JetBrains Mono
  extra_css:
    - overrides/main.css
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
    - header.autohide

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ZakLr/XIR
      name: XIR on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/xir-core/
      name: xir-core on PyPI
nav:
  - Home: index.md
  - Using XIR:
      - Agent guide: docs/AGENTS.md
      - Command reference: skills/xir/references/cli.md
      - Patterns: skills/xir/references/patterns.md
      - Writing a model: skills/xir/references/authoring.md
      - Troubleshooting: skills/xir/references/troubleshooting.md
      - Skill overview: skills/xir/README.md
      - Skill ontology: skills/xir/references/ontology.md
  - The language:
      - Ontology: spec/ontology.md
      - Grammar: spec/grammar.md
      - Semantics: spec/semantics.md
      - Semantic graph: spec/semantic-graph.md
      - Queries: spec/queries.md
      - Patches: spec/patches.md
      - Validation: spec/validation.md
      - Provenance: spec/provenance.md
      - Versioning: spec/versioning.md
  - Background:
      - v0.3 audit: docs/v0.3-audit.md
      - Landscape: research/landscape.md
      - Related systems: research/related-systems.md
      - Differentiation: research/differentiation.md
      - Design principles: research/design-principles.md
      - Open problems: research/open-problems.md
      - Benchmark methodology: research/benchmarks.md
      - Competitors: research/competitors.md
  - Project:
      - Repository guide: docs/REPO.md
      - Decisions: DECISIONS.md
      - Open questions: OPEN_QUESTIONS.md
      - Benchmarks: benchmarks/report.md
      - Roadmap: docs/ROADMAP.md
      - Community: docs/COMMUNITY.md
      - Star history: docs/STAR_HISTORY.md
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
