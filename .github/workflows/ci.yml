name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - run: pytest -q

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: run the semantic benchmark
        run: python benchmarks/tasks.py

  package:
    name: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build --wheel
      # the grammar is loaded from package data at runtime, so an installed
      # wheel that omits it would fail on import. Verify the real artifact.
      - name: install the wheel into a clean env and use it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/xir validate examples/project-manager/app.xir
          /tmp/venv/bin/python -c "import xir.ir as I; m=I.load_file('examples/project-manager/app.xir'); print(m.id, len(m.all_ids()))"

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[docs]
      # strict mode: a broken relative link fails the build, so docs cannot rot
      - name: build the site (strict)
        run: python branding/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: deploy docs
    # Same run as the build, so the artifact is the one CI just verified.
    needs: docs
    runs-on: ubuntu-latest
    # Pages must be enabled once, in Settings -> Pages -> Source: GitHub
    # Actions. Until then this job cannot start, and a red X on every push
    # would drown out real failures. The docs still build and are verified
    # either way; see docs/REPO.md.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: report whether Pages is enabled
        run: |
          if ! curl -sf -H "Accept: application/vnd.github+json"                "${{ github.api_url }}/repos/${{ github.repository }}/pages" >/dev/null; then
            echo "::warning::GitHub Pages is not enabled for this repository."
            echo "::warning::Enable it once: Settings -> Pages -> Source: GitHub Actions."
            echo "The site still builds and is verified; only the deploy is skipped."
          fi
      - name: download the verified build
        uses: actions/download-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: publish to PyPI
    # tag-driven, so a version bump is the only thing that can publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, benchmark, package, docs, deploy-docs]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing, no long-lived token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: check the tag matches the version
        run: |
          python - <<'PY'
          import re, pathlib, sys
          tag = pathlib.Path("pyproject.toml")
          version = re.search(r'^version = "([^"]+)"', tag.read_text(), re.M).group(1)
          expected = f"v{version}"
          actual = "${GITHUB_REF_NAME}"
          if actual != expected:
              sys.exit(f"tag {actual} does not match pyproject version {version}")
          print(f"ok: {actual} matches version {version}")
          PY
      - run: python -m build
      - run: pip install twine
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

